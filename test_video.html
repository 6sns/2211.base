<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video autoplay test</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
video{width:100%;height:60vh;object-fit:cover;display:block}
.info{padding:20px;font-size:14px}
#log{white-space:pre-wrap;color:lime;font-size:12px;padding:10px}
</style>
</head><body>

<video id="v" autoplay loop muted playsinline webkit-playsinline preload="auto">
<source src="hero_video.mp4" type="video/mp4">
</video>

<div class="info">
<p><b>Test 1:</b> Autoplay (muted, playsinline)</p>
<p>If video plays — autoplay works on your device.</p>
<p>If you see play button — tap anywhere on page.</p>
</div>
<div id="log"></div>

<script>
var v = document.getElementById('v');
var log = document.getElementById('log');
function l(s){ log.textContent += s + '\n'; }

v.muted = true;

['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing','stalled','waiting','error','suspend','pause'].forEach(function(e){
  v.addEventListener(e, function(){
    l(e + ' | readyState=' + v.readyState + ' paused=' + v.paused + ' muted=' + v.muted);
    if(e === 'canplay' || e === 'loadeddata'){
      v.muted = true;
      v.play().then(function(){ l('play() OK'); }).catch(function(e){ l('play() FAIL: ' + e.message); });
    }
  });
});

// Try play immediately
v.play().then(function(){ l('immediate play() OK'); }).catch(function(e){ l('immediate play() FAIL: ' + e.message); });

// Fallback: play on any touch
document.addEventListener('touchstart', function(){
  v.muted = true;
  v.play().then(function(){ l('touch play() OK'); }).catch(function(e){ l('touch play() FAIL: ' + e.message); });
}, {once:true});
</script>
</body></html>
